<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Box - TV Guide</title>
    <link rel="stylesheet" href="/css/thebox.css" />
  </head>
  <body class="layout-fixed">
    <div class="page-shell">
      <header class="header">
        <div class="header-row">
          <div>
            <div class="title">TV GUIDE</div>
            <div class="subtitle">RANDOM DAILY SCHEDULE</div>
          </div>
          <div class="subtitle">PAGE 200</div>
        </div>
        <div class="status-bar">
          <span id="status-text">INITIALISING...</span>
          <span><span id="date-text" style="visibility:hidden;display:none;"></span><span id="clock-text"></span></span>
        </div>
      </header>

      <main class="screen page-main no-scroll">
        <section class="panel no-scroll guide-panel">
          <div id="guide-header" class="guide-grid guide-header"></div>
          <div id="guide-body" class="guide-grid guide-body"></div>
        </section>
      </main>

      <footer class="footer">
        <section class="panel help">
          <p><a href="/">PAGE 100 - CHANNEL INDEX</a> | <a href="/remote-test.html">PAGE 400 - REMOTE TEST</a></p>
        </section>
      </footer>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/remote.js"></script>
    <script src="/js/dev-guide.js"></script>
    <script src="/js/guide.js"></script>
  </body>
</html>
